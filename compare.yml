name: compare

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (쉼표로 구분)'
        required: true
        default: '499790,030610'
        type: string
      dates:
        description: '확인할 날짜 (코드와 같은 순서, 쉼표로 구분)'
        required: true
        default: '2026-06-26,2026-06-23'
        type: string

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Compare
        run: python compare.py
        env:
          CODES: ${{ github.event.inputs.codes }}
          DATES: ${{ github.event.inputs.dates }}
